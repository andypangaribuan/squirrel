apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: $KYML_APP_NAME
  namespace: $KYML_NAMESPACE
spec:
  default:
    connectionDraining:
      drainingTimeoutSec: 60
  targetRef:
    group: ""
    kind: Service
    name: $KYML_APP_NAME


---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: $KYML_APP_NAME
  namespace: $KYML_NAMESPACE
spec:
  default:
    checkIntervalSec: 5
    timeoutSec: 3
    healthyThreshold: 1
    unhealthyThreshold: 3
    logConfig:
      enabled: true
    config:
      type: HTTP
      httpHealthCheck:
        portSpecification: USE_FIXED_PORT
        port: $KYML_HTTP_PORT_NUMBER
        requestPath: $KYML_HTTP_PROBE
  targetRef:
    group: ""
    kind: Service
    name: $KYML_APP_NAME


---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: $KYML_APP_NAME-redirect
  namespace: $KYML_NAMESPACE
spec:
  parentRefs:
  - name: external-gateway
    namespace: default
    sectionName: http
  hostnames:
  - $KYML_ING_DOMAIN
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301


---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: $KYML_APP_NAME
  namespace: $KYML_NAMESPACE
spec:
  parentRefs:
  - name: external-gateway
    namespace: default
    sectionName: https
  hostnames:
  - $KYML_ING_DOMAIN
  rules:
  - backendRefs:
    - name: $KYML_APP_NAME
      port: $KYML_HTTP_PORT_NUMBER
