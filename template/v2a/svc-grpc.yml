apiVersion: v1
kind: Service
metadata:
  name: $KYML_APP_NAME
  namespace: $KYML_NAMESPACE
spec:
  selector:
    app: $KYML_APP_NAME
  ports:
    - name: $KYML_GRPC_PORT_NAME
      port: $KYML_GRPC_PORT_NUMBER
      targetPort: $KYML_GRPC_PORT_NUMBER
      protocol: TCP
      appProtocol: kubernetes.io/h2c