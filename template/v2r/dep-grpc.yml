apiVersion: apps/v1
kind: Deployment
metadata:
  name: $KYML_APP_NAME
  namespace: $KYML_NAMESPACE
spec:
  replicas: $KYML_POD_REPLICA
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: $KYML_APP_NAME
  template:
    metadata:
      labels:
        app: $KYML_APP_NAME
      annotations: #{$KYML_INCLUDE_BLOCK_ANNOTATIONS,DEFAULT:true,DELETE_BLOCK}
        cluster-autoscaler.kubernetes.io/safe-to-evict: "{$KYML_POD_SAFE_TO_EVICT,DELETE_LINE}"
        linkerd.io/inject: {$KYML_LINKERD_INJECT,DEFAULT:enabled}
        config.linkerd.io/proxy-inbound-http-server-idle-timeout: "{$KYML_LINKERD_INBOUND_HTTP_SERVER_IDLE_TIMEOUT,DEFAULT:620s}" # Must exceed GCLB's 600s keepalive to stop backend_connection_closed_before_data_sent_to_client (503).
        config.linkerd.io/proxy-inbound-keepalive: "{$KYML_LINKERD_INBOUND_KEEPALIVE,DEFAULT:30s}" # Sends TCP probes so GCP VPC/NAT doesn't silently sever idle connections from GCLB.
        config.linkerd.io/proxy-outbound-http-server-idle-timeout: "{$KYML_LINKERD_OUTBOUND_HTTP_SERVER_IDLE_TIMEOUT,DEFAULT:300s}" # Keeps gRPC channels to other internal microservices warm to avoid re-handshake latency.
        config.linkerd.io/proxy-outbound-keepalive: "{$KYML_LINKERD_OUTBOUND_KEEPALIVE,DEFAULT:30s}" # Prevents PostgreSQL pool and gRPC TCP connections from becoming silent zombie sockets
        config.linkerd.io/proxy-cpu-request: {$KYML_LINKERD_CPU_REQUEST,DEFAULT:100m}
        config.linkerd.io/proxy-cpu-limit: {$KYML_LINKERD_CPU_LIMIT,DEFAULT:1000m}
        config.linkerd.io/proxy-memory-request: {$KYML_LINKERD_MEMORY_REQUEST,DEFAULT:128Mi}
        config.linkerd.io/proxy-memory-limit: {$KYML_LINKERD_MEMORY_LIMIT,DEFAULT:512Mi}
        config.linkerd.io/skip-outbound-ports: "{$KYML_SKIP_OUTBOUND_PORTS,DELETE_LINE}"
    spec:
      priorityClassName: "{$KYML_PRIORITY_CLASS,DELETE_LINE}"
      terminationGracePeriodSeconds: 90
      serviceAccountName: $KYML_APP_NAME
      topologySpreadConstraints: #{$KYML_INCLUDE_BLOCK_TOPOLOGY_SPREAD,DEFAULT:true,DELETE_BLOCK}
        - maxSkew: {$KYML_TOPOLOGY_MAX_SKEW_ZONE,DEFAULT:1}
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: $KYML_APP_NAME
        - maxSkew: {$KYML_TOPOLOGY_MAX_SKEW_HOSTNAME,DEFAULT:1}
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: $KYML_APP_NAME
      containers:
        - name: cloud-sql-proxy #{$KYML_INCLUDE_BLOCK_CLOUD_SQL_PROXY,DEFAULT:true,DELETE_BLOCK}
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.25.2
          args:
            - "--structured-logs"
            - "--port=5432"
            - "$KYML_GCP_PROJECT_ID:$KYML_GCP_DB_REGION:$KYML_GCP_DB_INSTANCE_ID"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532

        - name: $KYML_APP_NAME
          image: $KYML_IMAGE_PATH:$KYML_IMAGE_VERSION
          imagePullPolicy: IfNotPresent
          ports:
            - name: $KYML_GRPC_PORT_NAME
              containerPort: $KYML_GRPC_PORT_NUMBER
          envFrom:
            - secretRef:
                name: $KYML_APP_NAME
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: $KYML_CPU_REQUEST
              memory: $KYML_MEMORY_REQUEST
              ephemeral-storage: $KYML_EPHEMERAL_STORAGE
            limits:
              ephemeral-storage: $KYML_EPHEMERAL_STORAGE
          startupProbe:
            grpc:
              port: $KYML_GRPC_PORT_NUMBER
            initialDelaySeconds: 5
            periodSeconds: 3
            successThreshold: 1
            failureThreshold: 20
            timeoutSeconds: 3
          readinessProbe:
            grpc:
              port: $KYML_GRPC_PORT_NUMBER
            initialDelaySeconds: 5
            periodSeconds: 5
            successThreshold: 1
            failureThreshold: 3
            timeoutSeconds: 3
          livenessProbe:
            grpc:
              port: $KYML_GRPC_PORT_NUMBER
            initialDelaySeconds: 2
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
            timeoutSeconds: 3
          lifecycle: #{$KYML_INCLUDE_BLOCK_LIFE_CYCLE,DEFAULT:true,DELETE_BLOCK}
            preStop:
              exec:
                command: ["/app/x", "--sleep", "30s"]
          securityContext: #{$KYML_INCLUDE_BLOCK_SECURITY_CONTEXT,DEFAULT:true,DELETE_BLOCK}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
